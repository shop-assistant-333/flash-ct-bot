<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Exam Preparation</title>
    <!-- Telegram WebApp SDK: must load from telegram.org, it is not bundleable. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!--
      Resolves the colour theme before first paint, so the app never flashes
      light before React mounts. A pinned preference from the profile screen
      (localStorage) wins; otherwise Telegram dictates the theme when present,
      falling back to the OS preference outside it. Kept in sync afterwards by
      src/shared/lib/theme.ts — keep the two in agreement.
    -->
    <script>
      ;(function () {
        var stored = localStorage.getItem('theme-preference')
        var scheme
        if (stored === 'light' || stored === 'dark') {
          scheme = stored
        } else {
          var tg = window.Telegram && window.Telegram.WebApp
          scheme =
            (tg && tg.colorScheme) ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        }
        document.documentElement.dataset.theme = scheme === 'dark' ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
